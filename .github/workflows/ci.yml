name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Show toolchain version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn

      - name: Build
        run: moon build --deny-warn

      - name: Test
        run: moon test --deny-warn

      - name: Run demo
        run: moon run cmd/demo
